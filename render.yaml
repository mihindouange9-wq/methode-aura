# Blueprint Render : site statique, servi par le CDN de Render.
# Mise en route : Render → New → Blueprint → choisir ce dépôt. Chaque push sur la branche suivie redéploie.
# Seuls les fichiers publics sont publiés (index.html, css, js, assets, robots.txt) : la documentation,
# le PDF et les outils du dépôt restent hors ligne.
services:
  - type: web
    name: methode-aura
    runtime: static
    buildCommand: rm -rf dist && mkdir dist && cp -r index.html robots.txt css js assets dist/
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # Page unique : toute adresse inconnue renvoie la page (les fichiers existants sont servis en priorité).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vidéos, images, polices et librairies : un an de cache chez le visiteur.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # La page, les styles et les scripts du site : toujours revalidés.
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /css/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /js/*.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      # Le site n'appelle aucun service tiers : scripts, polices, vidéos et images viennent du domaine lui-même.
      # Les styles en ligne sont nécessaires aux animations (attributs style posés par GSAP).
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests
